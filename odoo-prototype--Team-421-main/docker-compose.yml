version: '3.8'

services:
  web:
    image: odoo:17.0
    container_name: dealflow_odoo_web
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - ./dealflow_odoo:/mnt/extra-addons/dealflow_odoo

  db:
    image: postgres:16
    container_name: dealflow_postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    ports:
      - "5432:5432"
    volumes:
      - dealflow_pgdata:/var/lib/postgresql/data

volumes:
  dealflow_pgdata:
