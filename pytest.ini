[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    -p no:hypothesis
    -p no:schemathesis
    -p no:cov
    -p no:xdist
    -p no:langsmith
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
